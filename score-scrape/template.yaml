
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Autodarts league results relay

Parameters:
  AllowedOrigin:
    Type: String
    Default: https://play.autodarts.com

Resources:
  ResultsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      MaximumMessageSize: 262144
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ResultsDeadLetterQueue.Arn
        maxReceiveCount: 5

  ResultsDeadLetterQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ResultsDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ResultsDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ResultsQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ResultsQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 259200
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ApiGatewaySqsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendResults
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ResultsQueue.Arn

  ResultsApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: darts-league-relay
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - GET
          - POST
        AllowHeaders:
          - content-type
        MaxAge: 3600

  ResultsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ResultsApi
      IntegrationType: AWS_PROXY
      IntegrationSubtype: SQS-SendMessage
      TimeoutInMillis: 10000
      PayloadFormatVersion: '1.0'
      CredentialsArn: !GetAtt ApiGatewaySqsRole.Arn
      RequestParameters:
        QueueUrl: !Ref ResultsQueue
        MessageBody: $request.body

  ResultsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ResultsApi
      RouteKey: POST /results
      AuthorizationType: NONE
      Target: !Sub integrations/${ResultsIntegration}

  ResultsReaderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: reader/
      Handler: index.handler
      Runtime: nodejs22.x
      Timeout: 10
      Environment:
        Variables:
          QUEUE_URL: !Ref ResultsQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
              Resource: !GetAtt ResultsQueue.Arn

  ResultsReaderIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ResultsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ResultsReaderFunction.Arn}/invocations
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 10000

  ResultsAckRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ResultsApi
      RouteKey: POST /results/ack
      AuthorizationType: NONE
      Target: !Sub integrations/${ResultsReaderIntegration}

  ResultsAckPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ResultsReaderFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ResultsApi}/*/POST/results/ack

  ResultsReaderRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ResultsApi
      RouteKey: GET /results
      AuthorizationType: NONE
      Target: !Sub integrations/${ResultsReaderIntegration}

  ResultsReaderPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ResultsReaderFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ResultsApi}/*/GET/results

  ResultsStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ResultsApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2

Outputs:
  AcknowledgementUrl:
    Value: !Sub https://${ResultsApi}.execute-api.${AWS::Region}.amazonaws.com/results/ack

  DeadLetterQueueUrl:
    Value: !Ref ResultsDeadLetterQueue

  SubmissionUrl:
    Value: !Sub
      https://${ResultsApi}.execute-api.${AWS::Region}.amazonaws.com/results

  ReadUrl:
    Value: !Sub
      https://${ResultsApi}.execute-api.${AWS::Region}.amazonaws.com/results

  QueueUrl:
    Value: !Ref ResultsQueue

  QueueArn:
    Value: !GetAtt ResultsQueue.Arn
